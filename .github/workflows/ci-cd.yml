name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app
      - run: pytest -q
        working-directory: app
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/pulsewatch-api:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/pulsewatch-api:${{ github.sha }}

  deploy:
    needs: build
    # runner is installed on your own VM (label: self-hosted)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          GH_OWNER: ${{ needs.build.outputs.owner }}
          TAG: ${{ github.sha }}
          CERT_DIR: /opt/pulsewatch/certs
        run: |
          cp /opt/pulsewatch/.env .env
          docker compose pull api1 api2 worker
          docker compose up -d --remove-orphans
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -ksf https://localhost/health && exit 0
            sleep 3
          done
          docker compose logs --tail=50
          exit 1
