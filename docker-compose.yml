name: pulsewatch

x-api: &api
  build: ./app
  image: ghcr.io/${GH_OWNER:-local}/pulsewatch-api:${TAG:-latest}
  restart: unless-stopped
  environment: &api-env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    API_KEY: ${API_KEY}
  depends_on:
    db:    { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on: [api1, api2]
    networks: [frontend]

  api1:
    <<: *api
    environment: { <<: *api-env, INSTANCE_NAME: api1 }
    networks: [frontend, backend]

  api2:
    <<: *api
    environment: { <<: *api-env, INSTANCE_NAME: api2 }
    networks: [frontend, backend]

  worker:
    <<: *api
    command: ["python", "worker.py"]
    # needs both DB/Redis (backend) and the internet (egress)
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/hb')<30 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  frontend:   # nginx <-> api
  backend:    # api/worker <-> db/redis (internal: no internet access)
    internal: true
  egress:     # worker only: outbound access for checking websites

volumes:
  pgdata:
  redisdata:
